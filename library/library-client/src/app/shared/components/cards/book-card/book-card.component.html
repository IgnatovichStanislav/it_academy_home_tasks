<div class="book card">
  <img
    *ngIf="book.pixUrl; else elseBlock"
    src="{{ book.pixUrl }}"
    class="img-fluid"
    alt=""
  />

  <ng-template #elseBlock>
    <svg
      class="bd-placeholder-img"
      width="100%"
      height="140"
      xmlns="http://www.w3.org/2000/svg"
      role="img"
      aria-label="Placeholder: Image cap"
      preserveAspectRatio="xMidYMid slice"
      focusable="false"
    >
      <title>Placeholder</title>
      <rect width="100%" height="100%" fill="#868e96"></rect>
      <text x="35%" y="51%" fill="#dee2e6" dy=".3em">Image</text>
    </svg>
  </ng-template>

  <div class="card-body">
    <h5 class="card-title" title="{{ book.title }}">{{ book.title }}</h5>
    <h6
      class="card-subtitle mb-2 text-muted"
      *ngIf="book.author && book.author.name"
    >
      {{ book.author.name }}
    </h6>

    <p class="card-text">
      {{ book.publicationDate | date : "y"
      }}<span *ngIf="book.category && book.category.name"
        >, {{ book.category.name }}</span
      >
    </p>

    <p class="card-text text-center" *ngIf="currentUser !== null">
      <app-button
        *ngIf="!book.favorite"
        [classes]="'btn-primary'"
        [text]="'Add to Favorites'"
        (onClick)="onSetFavorites($event, true)"
      ></app-button>

      <app-button
        *ngIf="book.favorite"
        [classes]="'btn-outline-success'"
        [text]="'Remove from favorite'"
        (onClick)="onSetFavorites($event, false)"
      ></app-button>
    </p>
  </div>
</div>
