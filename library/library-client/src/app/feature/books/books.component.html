<div class="container mt-1 books" [style]="{ minHeight: '100vh' }">
  <div class="row">
    <div class="col-12">
      <app-books-filter></app-books-filter>
    </div>
  </div>
  <div class="row" [ngStyle]="{ 'justify-content': 'center' }">
    <app-book-card
      class="book card col-md-2 m-2"
      [book]="book"
      *ngFor="let book of books | booksClientSideFilter : search"
    ></app-book-card>
  </div>
</div>
