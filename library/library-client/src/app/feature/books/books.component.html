<div class="container books">
  <app-books-filter
    [authors]="authors"
    (onFilterChange)="onFilterChange($event)"
    (onSearchChange)="onSearchChange($event)"
  ></app-books-filter>

  @if(this.loading){
  <app-loading-indicator></app-loading-indicator>
  }@else{
  <app-books-list [books]="books" [search]="search"></app-books-list>
  }
</div>
