<nav class="navbar navbar-expand-lg bg-body-tertiary">
  <div class="container-fluid">
    <a class="navbar-brand" [routerLink]="'/'">Library</a>
    <button
      class="navbar-toggler"
      type="button"
      data-bs-toggle="collapse"
      data-bs-target="#navbarSupportedContent"
      aria-controls="navbarSupportedContent"
      aria-expanded="false"
      aria-label="Toggle navigation"
    >
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarSupportedContent">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item">
          <a class="nav-link active" aria-current="page" [routerLink]="'/books'"
            >Books</a
          >
        </li>
        <li class="nav-item">
          <a class="nav-link" [routerLink]="'/categories'">Categories</a>
        </li>
        <li class="nav-item button">
          <a
            class="btn btn-primary"
            target="_blank"
            [routerLink]="'/books/add'"
          >
            Add New
          </a>
        </li>
      </ul>
      <div *ngIf="user !== null; else elseBlock" class="d-flex">
        {{ user.userName }} ({{ user.lastName }} {{ user.firstName }})
        <button
          class="btn btn-outline-success"
          type="button"
          (click)="logout()"
        >
          Logout
        </button>
      </div>

      <ng-template #elseBlock>
        <a class="btn btn-outline-success mr-5" [routerLink]="'/signup'"
          >Sign Up</a
        >
        <a class="btn btn-primary" [routerLink]="'/signin'">Sign In</a>
      </ng-template>
    </div>
  </div>
</nav>
